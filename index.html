<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Digital Edition of Horace, Carmen 1,12</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" rel="stylesheet">
  <style>
  <style>
    
  body {
    font-family: 'Open Sans', Arial, sans-serif;
    background: #f7fbff; /* light blue background */
    color: #15395b;       /* dark blue text for good contrast */
    margin: 2em;
  }

  h1 {
    font-size: 2.5em;
    font-weight: 700;
    color: #145da0;   /* prominent deep blue for the title */
    margin-bottom: 1em;
    letter-spacing: 1px;
  }

  section {
    background: #e3effc; /* very light blue panel */
    border-left: 6px solid #1766b5;
    margin-bottom: 2em;
    padding: 1.5em 1em 1em 1.5em;
    border-radius: 4px;
  }

  h2 {
    font-size: 1.2em;
    font-weight: 700;
    color: #1766b5;
    margin-top: 0;
    margin-bottom: 0.5em;
  }

  div, pre {
    font-size: 1.1em;
    margin-bottom: 1em;
  }

  pre {
    background: #162447;
    color: #f7fbff;
    padding: 1em;
    border-radius: 4px;
    border: 1px solid #145da0;
    overflow-x: auto;
    font-size: 1em;
    font-family: 'Fira Mono', 'Consolas', monospace;
  }

  button {
    background: #1766b5;
    color: #f7fbff;
    border: none;
    padding: 0.5em 1.2em;
    margin-bottom: 1em;
    margin-top: 0.2em;
    border-radius: 3px;
    font-size: 1em;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: background .18s;
  }

  button:hover, button:focus {
    background: #145da0;
    outline: none;
  }

  @media (max-width: 600px) {
    body { margin: 0.5em; }
    section { padding: 1em 0.5em 0.5em 1em; }
    h1 { font-size: 2em; }
  }
</style>
  </style>
</head>
<body>
  <h1>A Digital Edition of Horace, Carmen 1,12</h1>
<div id="file-content"></div>
<script src="js/app.js"></script>
</body>
</html>
